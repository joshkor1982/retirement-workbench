name: Release

# Push a tag like v1.0.0 to build every download and draft a GitHub release.
# Runs on macOS so the Mac app can be merged into one universal binary and
# signed; the Windows and Linux builds cross-compile from the same runner.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build every platform
        run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "ARW $GITHUB_REF_NAME"
